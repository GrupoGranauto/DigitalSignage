<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión - GranAuto</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Google Fonts: Inter para tipografía idéntica a la maqueta original -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Forzar tipografía Inter de forma global en todos los elementos del login */
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }

    :root {
      --font: 'Inter', system-ui, -apple-system, sans-serif !important;
    }

    html {
      font-size: 16px !important;
      height: 100% !important;
      overflow: hidden !important;
    }

    body.login-body {
      background: #ffffff !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
    }

    .login-split-layout {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Left side: Hero photo and branding */
    .login-hero-side {
      position: relative;
      flex: 1.6;
      background-image: url('images/NissanTaller.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px;
      box-sizing: border-box;
    }

    .login-hero-side::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(15, 15, 15, 0.85) 0%, rgba(25, 25, 25, 0.72) 50%, rgba(5, 5, 5, 0.9) 100%);
      z-index: 1;
    }

    .hero-top-brand {
      position: relative;
      z-index: 2;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    .developed-by {
      font-size: 0.44rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.65;
    }

    .brand-logo-img {
      width: 240px;
      height: auto;
      margin-top: -4px;
      opacity: 0.9;
      transition: opacity 0.2s ease;
      display: block;
    }

    .brand-logo-img:hover {
      opacity: 1;
    }

    /* Right side: Login & register form (Acomodo exacto de la maqueta) */
    .login-form-side {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 10;
      height: 100%;
      overflow-y: auto;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    @media (min-width: 1024px) {
      .login-form-side {
        width: 40%;
      }
    }

    @media (min-width: 1280px) {
      .login-form-side {
        width: 33.333333%;
      }
    }

    .login-form-wrapper {
      width: 100%;
      max-width: 380px;
      /* Ancho idéntico */
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Logo styling */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3.5rem;
      margin-top: 0;
    }

    .form-logo {
      height: 4.5rem;
      /* UN POCO MAS GRANDE (from 3.2rem) */
      width: auto;
      filter: brightness(0);
      /* Hacer negro */
      display: block;
    }

    /* Header text */
    .welcome-header-container {
      margin-bottom: 5.5rem;
      text-align: center;
    }

    .welcome-heading {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0f172a;
      margin: 0;
    }

    .welcome-heading .text-red {
      color: #c3002f;
      /* Nissan Red */
    }

    .welcome-sub {
      font-size: 0.82rem;
      color: #6b7280;
      font-weight: 400;
      margin-top: 0.4rem;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 500;
      color: #374151;
    }

    .forgot-pass-link {
      font-size: 0.78rem;
      color: #6b7280;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.15s ease;
    }

    .forgot-pass-link:hover {
      color: #c3002f;
    }

    /* Inputs style */
    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper input {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 38px;
      background-color: #f8fafc;
      /* bg-gray-50 */
      border: 1px solid #e2e8f0;
      /* border-gray-200 */
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      background-color: #ffffff;
      border-color: #c3002f;
      box-shadow: 0 0 0 3px rgba(195, 0, 47, 0.12);
    }

    /* SVG icons in inputs */
    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      top: 13px;
      width: 16px;
      height: 16px;
      color: #9ca3af;
      pointer-events: none;
      transition: color 0.15s ease;
    }

    .input-wrapper:focus-within .input-icon {
      color: #c3002f;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 13px;
      width: 16px;
      height: 16px;
      color: #9ca3af;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: color 0.15s ease;
    }

    .password-toggle-btn:hover {
      color: #4b5563;
    }

    /* Button styling */
    .login-btn {
      width: 100%;
      height: 42px;
      color: #ffffff;
      background-color: #c3002f;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      margin-top: 1.25rem;
      text-decoration: none;
      box-sizing: border-box;
    }

    .login-btn:hover {
      background-color: #a30d29;
    }

    .login-btn:active {
      transform: scale(0.985);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Bottom toggle link */
    .form-toggle-link {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      margin-top: 1.25rem;
      margin-bottom: 2.25rem;
      cursor: pointer;
      font-weight: 400;
      user-select: none;
      transition: color 0.15s ease;
    }

    .form-toggle-link:hover {
      color: #111827;
    }

    .form-toggle-link span {
      color: #c3002f;
      font-weight: 600;
      text-decoration: none;
    }

    .form-toggle-link span:hover {
      text-decoration: underline;
    }

    /* Separators */
    .divider {
      position: relative;
      margin-top: 2.25rem;
      text-align: center;
    }

    .divider-line {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
    }

    .divider-line-inner {
      width: 100%;
      border-top: 1px solid #e5e7eb;
    }

    .divider-text-container {
      position: relative;
      display: flex;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .divider-text {
      padding: 0 0.75rem;
      background-color: #ffffff;
      color: #9ca3af;
    }

    /* Google Button Wrapper (Estilo idéntico con overlay transparente) */
    .google-btn-wrapper {
      margin-top: 1.75rem;
      width: 100%;
      position: relative;
      min-height: 44px;
    }

    .custom-google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      /* gap-3 */
      padding: 0.75rem 1rem;
      /* py-3 px-4 */
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      /* border-gray-200 */
      border-radius: 0.75rem;
      /* rounded-xl */
      cursor: pointer;
      transition: all 0.3s;
      box-sizing: border-box;
      height: 44px;
    }

    .custom-google-btn:hover {
      background-color: #f8fafc;
      /* hover:bg-gray-50 */
      border-color: #cbd5e1;
      /* hover:border-gray-300 */
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .custom-google-btn svg {
      width: 1.25rem;
      /* w-5 */
      height: 1.25rem;
      /* h-5 */
      transition: transform 0.3s;
    }

    .custom-google-btn:hover svg {
      transform: scale(1.1);
    }

    .custom-google-btn span {
      font-size: 0.875rem;
      /* text-sm */
      font-weight: 700;
      /* font-bold */
      color: #475569;
      /* text-gray-700 */
    }

    /* Invisible overlay of the real Google GIS button */
    .google-real-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      /* Totalmente transparente */
      z-index: 20;
      overflow: hidden;
      cursor: pointer;
    }

    #google-signin-btn {
      width: 100% !important;
      height: 100% !important;
    }

    /* Alerts */
    .login-alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      line-height: 1.45;
    }

    .login-alert.alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }

    .login-alert.alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      display: block;
    }

    .login-alert.alert-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      display: block;
    }

    /* Avatar Selector */
    .avatar-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 8px 0;
    }

    .avatar-option {
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .avatar-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-option svg {
      width: 60%;
      height: 60%;
      fill: #64748b;
    }

    .avatar-option:hover {
      background: #e2e8f0;
      transform: scale(1.05);
    }

    .avatar-option.selected {
      border-color: #c3002f;
      box-shadow: 0 0 10px rgba(195, 0, 47, 0.15);
      background: rgba(195, 0, 47, 0.05);
    }

    /* Spinner */
    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-left-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .loading-state .btn-spinner {
      display: block;
    }

    .loading-state .btn-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive overrides */
    @media (max-width: 1023px) {
      .login-hero-side {
        display: none;
      }

      .login-form-side {
        width: 100%;
        height: 100vh;
        padding: 32px 20px;
      }
    }
  </style>
</head>

<body class="login-body">

  <div class="login-split-layout">

    <!-- Left Side: Hero Brand and Info -->
    <div class="login-hero-side">
      <div class="hero-top-brand">
        <span class="developed-by">DESARROLLADO POR</span>
        <img src="images/AUTOINSIGHTS-LOGO-03.png" alt="Auto Insights" class="brand-logo-img">
      </div>
    </div>

    <!-- Right Side: Forms (Estilo idéntico a la maqueta original) -->
    <div class="login-form-side">
      <div class="login-form-wrapper">

        <!-- Logo Container -->
        <div class="logo-container">
          <img src="images/GRUPOGRANAUTO-BLANCO.png" alt="Grupo Gran Auto" class="form-logo">
        </div>

        <!-- Welcome Header Container -->
        <div class="welcome-header-container">
          <h1 class="welcome-heading" id="form-title">Bienvenido a <span class="text-red">GranAuto</span></h1>
          <p class="welcome-sub" id="form-subtitle">Ingresa tus datos para acceder al portal corporativo.</p>
        </div>

        <!-- Hidden tabs to keep compatibility with login.js -->
        <div class="login-tabs" style="display: none;">
          <button class="login-tab-btn active" id="tab-login-btn">Iniciar Sesión</button>
          <button class="login-tab-btn" id="tab-register-btn">Registrarse</button>
        </div>

        <!-- Alert messages -->
        <div class="login-alert" id="status-alert"></div>

        <!-- LOGIN FORM -->
        <form id="login-form">
          <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
              <input type="email" id="login-email" placeholder="ejemplo@corporativo.com" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-mail">
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <div class="field-label-row">
              <label>Contraseña</label>
              <a href="#" class="forgot-pass-link" id="forgot-password-link">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="input-wrapper">
              <input type="password" id="login-password" placeholder="••••••••" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-lock">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <button type="button" class="password-toggle-btn" id="toggle-password-visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-eye w-4 h-4">
                  <path
                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                  </path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn" id="login-submit-btn">
            <span class="btn-spinner"></span>
            <span class="btn-text">Acceder al Portal <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4"
                style="display:inline-block; vertical-align:middle; margin-left:2px;">
                <path d="m9 18 6-6-6-6"></path>
              </svg></span>
          </button>

          <div class="form-toggle-link" id="go-to-register">
            ¿No tienes cuenta? <span>Solicitar Registro Institucional</span>
          </div>
        </form>

        <!-- FORGOT PASSWORD FORM (STEP 1) -->
        <form id="forgot-password-step1-form" style="display: none;">
          <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
              <input type="email" id="forgot-email" placeholder="ejemplo@corporativo.com" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-mail">
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              </svg>
            </div>
          </div>

          <button type="submit" class="login-btn" id="forgot-submit-btn1">
            <span class="btn-spinner"></span>
            <span class="btn-text">Enviar Código de Verificación <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4"
                style="display:inline-block; vertical-align:middle; margin-left:2px;">
                <path d="m9 18 6-6-6-6"></path>
              </svg></span>
          </button>

          <div class="form-toggle-link" id="go-back-to-login">
            ¿Recordaste tu contraseña? <span>Iniciar Sesión</span>
          </div>
        </form>

        <!-- FORGOT PASSWORD FORM (STEP 2) -->
        <form id="forgot-password-step2-form" style="display: none;">
          <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
              <input type="email" id="reset-email" placeholder="ejemplo@corporativo.com" required readonly>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-mail">
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label>Código de Verificación (6 dígitos)</label>
            <div class="input-wrapper">
              <input type="text" id="reset-code" placeholder="000000" maxlength="6" required
                style="text-align: center; letter-spacing: 0.3em; font-family: monospace;">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-shield-check">
                <path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label>Nueva Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="reset-new-password" placeholder="••••••••" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-lock">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label>Confirmar Nueva Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="reset-confirm-password" placeholder="••••••••" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-lock">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
          </div>

          <button type="submit" class="login-btn" id="forgot-submit-btn2">
            <span class="btn-spinner"></span>
            <span class="btn-text">Restablecer Contraseña <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4"
                style="display:inline-block; vertical-align:middle; margin-left:2px;">
                <path d="m9 18 6-6-6-6"></path>
              </svg></span>
          </button>

          <div class="form-toggle-link" id="go-back-to-step1" style="display: flex; justify-content: space-between; padding: 0 4px;">
            <span id="btn-resend-code">Volver a Enviar Código</span>
            <span id="btn-cancel-reset">Cancelar</span>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" style="display: none;">
          <div class="form-group">
            <label>Nombre Completo</label>
            <div class="input-wrapper">
              <input type="text" id="reg-name" placeholder="Tu Nombre y Apellido" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-user">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper">
              <input type="email" id="reg-email" placeholder="ejemplo@granauto.mx" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-mail">
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="input-icon lucide lucide-lock">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
          </div>


          <button type="submit" class="login-btn" id="register-submit-btn">
            <span class="btn-spinner"></span>
            <span class="btn-text">Solicitar Registro <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-chevron-right w-4 h-4"
                style="display:inline-block; vertical-align:middle; margin-left:2px;">
                <path d="m9 18 6-6-6-6"></path>
              </svg></span>
          </button>

          <div class="form-toggle-link" id="go-to-login">
            ¿Ya tienes cuenta? <span>Iniciar Sesión</span>
          </div>
        </form>

        <!-- Google Sign In -->
        <div id="google-auth-section">
          <div class="divider">
            <div class="divider-line">
              <div class="divider-line-inner"></div>
            </div>
            <div class="divider-text-container">
              <span class="divider-text">o también puedes</span>
            </div>
          </div>

          <!-- Google Button Wrapper -->
          <div class="google-btn-wrapper">
            <!-- Fake button identical to the mockup -->
            <button type="button" class="custom-google-btn">
              <svg viewBox="0 0 24 24">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  fill="#4285F4"></path>
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"></path>
                <path
                  d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                  fill="#FBBC05"></path>
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"></path>
              </svg>
              <span>Continuar con Google</span>
            </button>
            <!-- Invisible real button overlay -->
            <div class="google-real-overlay">
              <div id="google-signin-btn"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>

</html>
