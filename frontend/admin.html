<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configuración de Pantallas - Citas de Servicio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos Premium específicos para el panel interactivo del Administrador */
    body {
      overflow-y: auto;
      background: radial-gradient(circle at top, #1a1e29 0%, #0c0e14 100%);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .admin-header {
      border-bottom: 2px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 20px;
      margin-bottom: 32px;
      text-align: center;
    }

    .admin-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 0.5px;
    }

    .admin-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Grid de Selección de Agencia */
    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .grid-agencies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .admin-agency-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .admin-agency-card:hover, .admin-agency-card.selected {
      background: var(--nissan-red);
      border-color: var(--nissan-red);
      box-shadow: 0 8px 25px rgba(195, 0, 47, 0.3);
      transform: translateY(-3px);
    }

    .admin-agency-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-white);
    }

    /* Caja de Resultados y Embeds */
    .embed-generator-box {
      background: var(--card-dark);
      border-radius: 12px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none; /* Se activa al seleccionar una agencia */
    }

    .embed-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .embed-row label {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-copy-group {
      display: flex;
      gap: 12px;
    }

    .embed-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-white);
      padding: 12px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      outline: none;
      read-only: true;
    }

    .copy-btn {
      background: var(--nissan-red);
      border: none;
      color: var(--text-white);
      padding: 12px 24px;
      border-radius: 6px;
      font-family: var(--font);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 140px;
    }

    .copy-btn:hover {
      background: var(--dark-red);
      transform: translateY(-1px);
    }

    .copy-btn.success {
      background: #2ecc71;
    }

    /* Vista Previa Iframe */
    .preview-container {
      margin-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
    }

    .preview-iframe {
      width: 100%;
      height: 450px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: #000;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="admin-header">
      <h1 class="admin-title">Configuración de pantallas</h1>
      <p class="admin-subtitle">Crea y previsualiza tableros de Digital Signage filtrados por agencia</p>
    </div>

    <!-- Sección 1: Selección de Agencia -->
    <h2 class="section-title">1. Selecciona la Agencia</h2>
    <div class="grid-agencies" id="admin-agency-grid">
      <!-- Inyectado por JS -->
    </div>

    <!-- Sección 2: Enlace de Embed -->
    <div class="embed-generator-box" id="generator-box">
      <h2 class="section-title" style="margin-bottom: 24px;">2. Código de Enlace y Previsualización</h2>
      
      <div class="embed-row">
        <label>Enlace de Visualización Directa</label>
        <div class="input-copy-group">
          <input type="text" class="embed-input" id="link-direct" readonly>
          <button class="copy-btn" id="btn-copy-direct">Copiar Enlace</button>
        </div>
      </div>

      <div class="embed-row">
        <label>Código Iframe HTML (para otras aplicaciones)</label>
        <div class="input-copy-group">
          <input type="text" class="embed-input" id="link-iframe" readonly>
          <button class="copy-btn" id="btn-copy-iframe">Copiar Iframe</button>
        </div>
      </div>

      <div class="preview-container">
        <h3 class="section-title">Vista Previa en Tiempo Real</h3>
        <iframe class="preview-iframe" id="preview-frame" src=""></iframe>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
