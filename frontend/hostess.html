<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Hostess - Citas de Servicio</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth-shield.js"></script>
  <style>
    /* ══════════════════════════════════════════════════
       PANEL HOSTESS — DISEÑO CORPORATIVO (LIGERO / BLANCO)
       Diseño móvil-primero, minimalista, limpio y profesional.
    ══════════════════════════════════════════════════ */

    :root {
      --bg-light: #f4f6f8;        /* Fondo gris claro empresarial */
      --card-bg: #ffffff;        /* Fondo blanco para las tarjetas */
      --text-main: #1e293b;      /* Texto principal oscuro contrastante */
      --text-muted: #64748b;     /* Texto gris secundario */
      --nissan-red: #c3002f;     /* Rojo Nissan corporativo */
      --nissan-red-hover: #9e0024;
      --border-color: #e2e8f0;   /* Color de bordes limpios */
      --font: 'NissanBrand', system-ui, sans-serif;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.02);
    }

    html {
      font-size: 16px; /* Base fija para legibilidad móvil */
      height: auto !important;
      overflow-y: auto !important;
    }

    body {
      background: var(--bg-light) !important;
      color: var(--text-main) !important;
      height: auto !important;
      overflow-y: auto !important;
      min-height: 100vh;
      font-family: var(--font);
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 12px 30px;
      box-sizing: border-box;
    }

    /* ── HEADER ─────────────────────────────────────── */
    .hostess-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }

    .hostess-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hostess-title span {
      background-color: var(--nissan-red);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .change-agency-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .change-agency-btn:active {
      background: #f1f5f9;
    }

    /* ── SELECTOR DE AGENCIA ────────────────────────── */
    .selection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .agency-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .agency-card:active {
      border-color: var(--nissan-red);
      background: #fafafa;
    }

    .agency-name-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* ── TARJETA DE CITA ────────────────────────────── */
    .hostess-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      border-left: 5px solid #cbd5e1; /* Gris por defecto */
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03), 0 2px 4px -1px rgba(0,0,0,0.01);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.15s ease;
    }
    .hostess-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -2px rgba(0,0,0,0.02);
      border-color: #cbd5e1;
    }

    /* Fila superior: tiempo + info del cliente */
    .hostess-card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .hostess-card-time {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-main);
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      min-width: 68px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }

    .hostess-card-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hostess-card-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hostess-card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hostess-card-meta .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-icon {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      opacity: 0.8;
      flex-shrink: 0;
    }

    .meta-label {
      font-weight: 600;
      color: var(--text-muted);
      min-width: 65px;
      flex-shrink: 0;
    }

    .hostess-card-meta span.advisor {
      font-weight: 600;
      color: var(--text-main);
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .hostess-card-meta span.vehicle {
      color: var(--nissan-red);
      font-weight: 700;
    }

    /* Fila de acciones */
    .hostess-card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hostess-card-actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── ESTADOS DE TARJETA ─────────────────────────── */
    .hostess-card.is-attending {
      border-left-width: 6px;
      border-left-color: var(--nissan-red);
      background: linear-gradient(135deg, #ffffff 0%, #fff5f6 100%);
      border-color: #fca5a5;
      box-shadow: 0 10px 15px -3px rgba(195,0,47,0.06), 0 4px 6px -2px rgba(195,0,47,0.02);
    }
    .hostess-card.is-attending:hover {
      box-shadow: 0 12px 20px -3px rgba(195,0,47,0.12), 0 6px 10px -2px rgba(195,0,47,0.04);
    }
    .hostess-card.is-attending .hostess-card-time {
      background: var(--nissan-red);
      color: #ffffff;
      border-color: var(--nissan-red);
      box-shadow: none;
    }

    .hostess-card.is-attending-secondary {
      border-left-width: 6px;
      border-left-color: #10b981; /* Verde esmeralda empresarial */
      background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      border-color: #a7f3d0;
      box-shadow: 0 10px 15px -3px rgba(16,185,129,0.06);
    }
    .hostess-card.is-attending-secondary:hover {
      box-shadow: 0 12px 20px -3px rgba(16,185,129,0.1);
    }
    .hostess-card.is-attending-secondary .hostess-card-time {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: none;
    }

    .hostess-card.is-completed {
      border-left-width: 4px;
      border-left-color: #94a3b8;
      background: #f8fafc;
      border-color: var(--border-color);
      opacity: 0.75;
      box-shadow: none;
    }
    .hostess-card.is-completed:hover {
      opacity: 0.95;
      box-shadow: var(--shadow-sm);
    }
    .hostess-card.is-completed .hostess-card-time {
      background: #e2e8f0;
      color: #64748b;
      border-color: #cbd5e1;
    }

    /* ── BADGES DE ESTADO ───────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .status-badge.active-signage {
      background-color: #fee2e2;
      border: 1px solid #fca5a5;
      color: var(--nissan-red);
    }

    .status-badge.attending-status {
      background-color: #d1fae5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .completed-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      background-color: #f1f5f9;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .no-show-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      background-color: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Punto indicador estático (sin animaciones pulsantes) */
    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: currentColor;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── BOTONES DE ACCIÓN ──────────────────────────── */
    .attend-btn {
      width: 100%;
      background: var(--nissan-red);
      border: none;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(195,0,47,0.15);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .attend-btn:hover {
      background: var(--nissan-red-hover);
      box-shadow: 0 4px 10px rgba(195, 0, 47, 0.2);
    }

    .attend-btn:active {
      transform: scale(0.98);
    }

    .action-btn {
      flex: 1;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      min-width: 0;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: var(--text-main);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .exit-btn {
      border: 1px solid #ea580c; /* Naranja corporativo */
      color: #ea580c;
    }

    .exit-btn:hover {
      background: #fff7ed;
      border-color: #f97316;
      color: #ea580c;
    }

    .screen-btn {
      border: 1px solid var(--nissan-red);
      color: var(--nissan-red);
    }

    .screen-btn:hover {
      background: #fdf2f4;
      border-color: var(--nissan-red-hover);
      color: var(--nissan-red);
    }

    .reattend-btn {
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 8px 12px;
    }

    .reattend-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .noshow-btn, .queue-return-btn {
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .noshow-btn:hover, .queue-return-btn:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    /* ── ACORDEÓN DE COMPLETADOS ────────────────────── */
    .completed-accordion {
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .completed-accordion-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: #f8fafc;
      border: none;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .completed-accordion-header:active {
      background: #f1f5f9;
    }

    .accordion-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #completed-count-badge {
      background: #e2e8f0;
      color: #475569;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .accordion-arrow {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .accordion-arrow.is-expanded {
      transform: rotate(180deg);
    }

    .completed-accordion-content {
      padding: 16px 14px 4px;
      border-top: 1px solid var(--border-color);
      background: #fafafa;
    }

    /* ── ESTADO VACÍO ───────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      margin-top: 24px;
      box-shadow: var(--shadow-sm);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ── POPUP MODAL PERSONALIZADO ────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4); /* Backdrop semitransparente oscuro */
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .animate-modal {
      animation: modalEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalEnter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      padding: 18px 20px 10px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .modal-body {
      padding: 10px 20px 20px;
    }

    .modal-body p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .modal-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn.cancel-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .modal-btn.cancel-btn:active {
      background: #f1f5f9;
    }

    .modal-btn.ok-btn {
      background: var(--nissan-red);
      border: none;
      color: #ffffff;
    }

    .modal-btn.ok-btn:active {
      background: var(--nissan-red-hover);
    }

    /* ── SECCIONES DE PANEL Y DISEÑO PREMIUM ──────────────── */
    .active-section-container {
      background: linear-gradient(135deg, #ffffff 0%, #fafbfc 100%);
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .hostess-section-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      text-transform: uppercase;
    }

    .active-section-title {
      color: var(--nissan-red);
    }

    .pending-section-title {
      color: var(--text-muted);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .live-pulse-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background-color: var(--nissan-red);
      border-radius: 50%;
      margin-right: 8px;
      position: relative;
      vertical-align: middle;
    }

    .live-pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--nissan-red);
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      opacity: 0.8;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.5);
        opacity: 0.8;
      }
      80%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* Decoración de esquina para tarjetas activas */
    .hostess-card.is-attending, .hostess-card.is-attending-secondary {
      position: relative;
      overflow: hidden;
    }

    .hostess-card.is-attending::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, transparent 50%, rgba(195,0,47,0.05) 50%);
      border-top-right-radius: 11px;
    }

    .hostess-card.is-attending-secondary::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, transparent 50%, rgba(16,185,129,0.05) 50%);
      border-top-right-radius: 11px;
    }

    /* Responsive grid styles for Tablet & PC */
    @media (min-width: 576px) {
      .container {
        max-width: 720px;
        padding: 20px 16px 40px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 960px;
      }
      
      .selection-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      
      #active-appointments-list,
      #appointments-list,
      #completed-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        align-items: stretch;
      }
      
      .hostess-card {
        margin-bottom: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 1350px;
        padding: 32px 24px 60px;
      }
      
      .selection-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      
      #active-appointments-list,
      #appointments-list,
      #completed-list {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
    }

    @media (min-width: 1400px) {
      .container {
        max-width: 1600px;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de Usuario Premium -->
  <div class="user-profile-bar" id="user-profile-bar">
    <div class="user-profile-info">
      <div class="user-profile-avatar-container">
        <img id="user-profile-avatar" src="" alt="Avatar" class="user-profile-avatar-img">
      </div>
      <div class="user-profile-meta">
        <div class="user-profile-name" id="user-profile-name">Cargando...</div>
        <div class="user-profile-role" id="user-profile-role">Acceso Autorizado</div>
      </div>
    </div>
    <div class="user-profile-actions">
      <button class="logout-btn" id="logout-button">
        <svg viewBox="0 0 24 24" class="logout-icon"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>

  <main class="container">
    <!-- Vista 1: Selector de Agencia -->
    <div id="agency-selection-view">
      <div class="hostess-header" style="justify-content: center; margin-bottom: 32px;">
        <h1 class="hostess-title">SELECCIONA TU AGENCIA</h1>
      </div>
      <div class="selection-grid" id="agency-grid">
        <!-- Inyectado por JS -->
      </div>
    </div>

    <!-- Vista 2: Panel de Gestión de Citas -->
    <div id="hostess-panel-view" style="display: none;">
      <div class="hostess-header">
        <h1 class="hostess-title">
          <span id="display-agency-badge">AGENCIA</span>
          Citas de Hoy
        </h1>
        <button class="change-agency-btn" id="change-agency-button">Cambiar Agencia</button>
      </div>

      <!-- SECCIÓN ACTIVA: EN PANTALLA Y EN CURSO -->
      <div id="active-appointments-section" class="active-section-container" style="display: none;">
        <h2 class="hostess-section-title active-section-title">
          <span class="live-pulse-dot"></span> En Pantalla y Atención
        </h2>
        <div id="active-appointments-list">
          <!-- Inyectado por JS -->
        </div>
      </div>

      <!-- SECCIÓN GENERAL: FILA DE ESPERA -->
      <div id="pending-appointments-section">
        <h2 class="hostess-section-title pending-section-title">Fila de Espera</h2>
        <div id="appointments-list">
          <!-- Inyectado por JS -->
        </div>
      </div>

      <!-- Sección de Citas Atendidas / No Asistidas (Acordeón Colapsable al final) -->
      <div id="completed-section" class="completed-accordion" style="display: none;">
        <button type="button" class="completed-accordion-header" id="completed-accordion-toggle">
          <span class="accordion-title">Citas Atendidas / No Asistidas <span id="completed-count-badge">0</span></span>
          <svg class="accordion-arrow" id="completed-accordion-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="completed-accordion-content" id="completed-accordion-content" style="display: none;">
          <div id="completed-list">
            <!-- Inyectado por JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal de confirmación personalizado -->
  <div id="confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card animate-modal">
      <div class="modal-header">
        <h3 class="modal-title" id="confirm-title">Confirmar Acción</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-message">¿Estás seguro de realizar esta acción?</p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel-btn" class="modal-btn cancel-btn">Cancelar</button>
        <button id="confirm-ok-btn" class="modal-btn ok-btn">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="hostess.js"></script>
</body>
</html>
